# Load through dsh --patch; credential values belong in the DSH credentials provider.
- id: afp
  config:
    agentResultMaxBytes: 16384
    # Write enablement is stored in the profile feature config.json, never in deployment settings.
    # Select an image-capable provider/model already configured in Settings.
    visionProvider: YOUR_CONFIGURED_PROVIDER
    visionModel: YOUR_CONFIGURED_MODEL
    accessTokenRef: AFP_ACCESS_TOKEN
    usernameRef: AFP_USERNAME
    passwordRef: AFP_PASSWORD
    previewAutoCdnHosts: true
    previewCdnHosts: []
    targetPerCategory: 100
    batchSize: 30
    maxBatches: 10
    concurrency: 3
