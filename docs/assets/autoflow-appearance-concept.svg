  </g>

  <path d="M284 681h984" stroke="#e6e3dd"/>
  <text x="284" y="720" class="section">字体</text><text x="284" y="743" class="small muted">跟随系统、无衬线与衬线；下方字号继续只作用于会话正文。</text>
  <g transform="translate(284 762)">
    <rect width="303" height="76" rx="11" class="selected" filter="url(#shadow)"/><use href="#tick" x="303" y="0"/><text x="151" y="46" text-anchor="middle" font-size="25">Aa</text><text x="151" y="102" text-anchor="middle" class="label">跟随系统</text>
    <rect x="318" width="303" height="76" rx="11" class="plain"/><text x="469" y="46" text-anchor="middle" font-size="25" font-family="Arial,sans-serif">Aa</text><text x="469" y="102" text-anchor="middle" class="label">无衬线</text>
    <rect x="636" width="303" height="76" rx="11" class="plain"/><text x="787" y="46" text-anchor="middle" font-size="25" font-family="Georgia,serif">Aa</text><text x="787" y="102" text-anchor="middle" class="label">衬线</text>
