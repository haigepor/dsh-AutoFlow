<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="2220" viewBox="0 0 1320 2220" role="img" aria-labelledby="title desc">
  <title id="title">AutoFlow 外观设置页示意图</title>
  <desc id="desc">设置侧栏中的外观分区，采用带 SVG 缩略预览的主题、颜色预设、字体、圆角、密度、侧边栏、布局、内容宽度与方向选项。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#473f37" flood-opacity=".08"/></filter>
    <linearGradient id="rainbow" x2="1" y2="1"><stop stop-color="#f8c65d"/><stop offset=".26" stop-color="#ef8c65"/><stop offset=".5" stop-color="#65b87b"/><stop offset=".75" stop-color="#399ed5"/><stop offset="1" stop-color="#b890d5"/></linearGradient>
    <linearGradient id="peach" x2="1" y2="1"><stop stop-color="#ffe1d2"/><stop offset="1" stop-color="#d88470"/></linearGradient>
    <linearGradient id="mono" x2="1" y2="1"><stop stop-color="#181818"/><stop offset="1" stop-color="#f6f6f3"/></linearGradient>
    <linearGradient id="night" x2="1" y2="1"><stop stop-color="#315f56"/><stop offset="1" stop-color="#946b88"/></linearGradient>
    <linearGradient id="rose" x2="1" y2="1"><stop stop-color="#dc3b72"/><stop offset="1" stop-color="#ff9bb0"/></linearGradient>
    <linearGradient id="tidal" x2="1" y2="1"><stop stop-color="#00bf9d"/><stop offset="1" stop-color="#198f91"/></linearGradient>
    <linearGradient id="sunset" x2="1" y2="1"><stop stop-color="#d55150"/><stop offset="1" stop-color="#ff9e78"/></linearGradient>
    <linearGradient id="forest" x2="1" y2="1"><stop stop-color="#087b72"/><stop offset="1" stop-color="#617c8d"/></linearGradient>
    <style>
      text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#292722}
      .muted{fill:#89867f}.section{font-size:17px;font-weight:600}.label{font-size:13px}.small{font-size:12px}.nav{font-size:15px}.selected{fill:#fff;stroke:#dc846e;stroke-width:1.6}.plain{fill:#fff;stroke:#dcdad4;stroke-width:1}.check{fill:#dc846e;stroke:#fff;stroke-width:2}.checkMark{fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <g id="tick"><circle r="11" class="check"/><path d="M-4 0l3 3 5-6" class="checkMark"/></g>
    <g id="mini-lines" fill="#aba8a1"><rect x="0" y="0" width="43" height="5" rx="2.5"/><rect x="0" y="9" width="57" height="5" rx="2.5"/><rect x="0" y="18" width="31" height="5" rx="2.5"/></g>
  </defs>

  <rect width="1320" height="2220" fill="#f7f6f3"/>
  <rect x="0" y="0" width="244" height="2220" fill="#eeede9"/>
  <rect x="244" y="0" width="1076" height="2220" fill="#fbfaf8"/>
  <path d="M243.5 0v2220" stroke="#e7e5df"/>
  <text x="30" y="50" font-size="18" font-weight="700">设置</text>
  <path d="M30 84h184" stroke="#dddcd6"/>
  <text x="47" y="125" class="nav muted">通用设置</text>
  <rect x="20" y="146" width="204" height="46" rx="10" fill="#dedbd4"/>
  <circle cx="43" cy="169" r="7" fill="none" stroke="#a46350" stroke-width="1.6"/><circle cx="43" cy="169" r="2" fill="#a46350"/>
  <text x="64" y="175" class="nav" font-weight="600">外观</text>
  <text x="47" y="227" class="nav muted">模型</text>
  <text x="47" y="275" class="nav muted">内置插件</text>
  <text x="47" y="323" class="nav muted">Agent 预设</text>
  <path d="M30 2140h184" stroke="#dddcd6"/><text x="46" y="2174" class="nav muted">‹  返回</text>

  <text x="284" y="57" font-size="29" font-weight="700">外观</text>
  <text x="284" y="84" font-size="14" class="muted">用可视化预览选择界面风格；更改后可立即在当前窗口查看。</text>
  <rect x="1124" y="36" width="145" height="38" rx="10" class="plain"/><text x="1196" y="60" text-anchor="middle" class="label">恢复默认外观</text>
  <path d="M284 112h984" stroke="#e6e3dd"/>

  <text x="284" y="153" class="section">主题</text>
  <text x="284" y="176" class="small muted">系统模式会随设备外观自动切换</text>
