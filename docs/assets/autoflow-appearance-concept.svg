    <rect x="242" width="226" height="72" rx="11" class="selected" filter="url(#shadow)"/><use href="#tick" x="468" y="0"/><rect x="269" y="22" width="134" height="4" rx="2" fill="#77736d"/><rect x="269" y="34" width="112" height="4" rx="2" fill="#77736d"/><rect x="269" y="46" width="91" height="4" rx="2" fill="#77736d"/><text x="355" y="96" text-anchor="middle" class="label">默认</text>
