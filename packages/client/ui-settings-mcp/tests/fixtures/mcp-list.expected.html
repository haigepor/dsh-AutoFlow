<div>
  <section
    class="section"
    data-mcp-settings="true"
  >
    <header
      class="header"
      data-settings-page-header="true"
    >
      <h1>
        MCP servers
      </h1>
      <div
        class="headerActions"
      >
        <button
          class="button outline md"
          type="button"
        >
          <span
            class="icon"
          >
            <svg
              aria-hidden="true"
              data-content="713ebf17"
              data-icon="dsw-icon-refresh-outline-regular"
              height="16"
              width="16"
            />
          </span>
          Restart and apply
        </button>
        <button
          aria-label="Import JSON configuration"
          class="button outline md"
          type="button"
        >
          <span
            class="icon"
          >
            <svg
              aria-hidden="true"
              data-content="f5bf4df1"
              data-icon="dsw-icon-code-outline-regular"
              height="16"
              width="16"
            />
          </span>
        </button>
        <button
          class="button primary md"
          type="button"
        >
          <span
            class="icon"
          >
            <svg
              aria-hidden="true"
              data-content="c04850e4"
              data-icon="dsw-icon-plus-outline-regular"
              height="16"
              width="16"
            />
          </span>
          Add MCP
        </button>
      </div>
    </header>
    <div
      class="introduction"
      data-mcp-introduction="true"
    >
      <img
        alt=""
        aria-hidden="true"
        decoding="async"
        draggable="false"
        height="78"
        src="/packages/client/ui-settings-mcp/src/client/assets/mcp-connection-whale-maid-v2.webp"
        width="104"
      />
      <div>
        <div
          class="introTitle"
        >
          <h2>
            Connect external tools and data
          </h2>
          <button
            aria-expanded="false"
            aria-haspopup="dialog"
            aria-label="How MCP configuration changes take effect"
            class="helpButton"
            type="button"
          >
            <svg
              aria-hidden="true"
              data-content="7aacddd3"
              fill="none"
              height="16"
              viewBox="0 0 20 20"
              width="16"
            />
          </button>
        </div>
        <p
          class="intro"
        >
          Changes apply to subsequent steps in existing conversations.
        </p>
      </div>
    </div>
    <div
      class="list"
    >
      <div
        class="row"
      >
        <button
          aria-label="Configure demo"
          class="rowMain"
          type="button"
        >
          <div
            class="rowTitle"
          >
            <span
              class="serverName"
            >
              demo
            </span>
            <span
              class="tag"
              data-tone="success"
            >
              Connected
            </span>
          </div>
          <div
            class="rowMeta"
          >
            <span>
              Remote service
            </span>
            <span>
              1 tools
            </span>
          </div>
        </button>
        <button
          aria-busy="false"
          aria-checked="true"
          aria-label="Enable demo"
          class="switch"
          data-loading="false"
          role="switch"
          type="button"
        >
          <span
            aria-hidden="true"
            class="thumb"
          >
            <span
              class="progress"
            />
          </span>
        </button>
        <button
          aria-label="Configure demo"
          class="button ghost md"
          type="button"
        >
          <svg
            aria-hidden="true"
            data-content="a4e8349c"
            data-icon="dsw-icon-chevron-right-outline-regular"
            height="14"
            width="14"
          />
        </button>
      </div>
    </div>
  </section>
</div>
