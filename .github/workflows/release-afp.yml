name: Release AFP plugin

on:
  push:
    tags: ['afp-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: afp-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify AFP tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          case "$RELEASE_REF" in refs/tags/afp-v*) ;; *) echo 'Run from an AFP tag'; exit 1 ;; esac
      - run: pnpm install --frozen-lockfile
      - name: Prepare exact-version assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: pnpm --filter dsh-plugin-afp run release:prepare --tag "$RELEASE_TAG" --out .artifacts/afp-release
      - uses: actions/upload-artifact@v4
        with:
          name: afp-release
          path: |
            .artifacts/afp-release/*.tgz
            .artifacts/afp-release/SHA256SUMS
            .artifacts/afp-release/afp-update.json
          if-no-files-found: error

  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: afp-release
          path: assets
      - name: Publish AFP assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        working-directory: assets
        run: |
          sha256sum --check SHA256SUMS
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import assert from 'node:assert/strict'
          import { createHash } from 'node:crypto'
          const metadata = JSON.parse(fs.readFileSync('afp-update.json', 'utf8'))
          assert.equal(metadata.sourceDirty, false)
          assert.equal(metadata.tag, process.env.RELEASE_TAG)
          assert.equal(metadata.tag, `afp-v${metadata.version}`)
          assert.equal(metadata.sourceCommit, process.env.RELEASE_COMMIT)
          assert.equal(metadata.repository, process.env.GH_REPO)
          assert.equal(metadata.asset.name, `dsh-plugin-afp-${metadata.version}.tgz`)
          const bytes = fs.readFileSync(metadata.asset.name)
          assert.equal(metadata.asset.size, bytes.length)
          assert.equal(metadata.asset.sha256, createHash('sha256').update(bytes).digest('hex'))
          NODE
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; published assets are immutable and will not be overwritten.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" ./*.tgz SHA256SUMS afp-update.json --verify-tag --draft --latest=false --title "AFP ${RELEASE_TAG#afp-v}" --notes 'Independent AFP plugin bundle. Includes package tarball, SHA-256 and version metadata. Runtime automatic updates are not enabled by this release.'
          asset_count=$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq '.assets | length')
          test "$asset_count" -eq 3
          gh release edit "$RELEASE_TAG" --draft=false --latest=false
