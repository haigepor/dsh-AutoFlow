interface:
  display_name: "DSH 自定义插件发布"
  short_description: "发布五种自定义插件，核验独立版本、安装包及共享更新索引"
  default_prompt: "使用 $dsh-custom-plugin-release 比较各插件最近发布标签，只为需要更新的产品升版；按已授权范围构建并发布 GitHub Release，等待共享官方索引任务成功，核对版本、源码、资产及索引，同时保留桌面策略和其他插件。默认不重复下载、不创建隔离 profile 或演练更新；异常或明确要求时追加验证，不覆盖公开版本。"
policy:
  allow_implicit_invocation: true
