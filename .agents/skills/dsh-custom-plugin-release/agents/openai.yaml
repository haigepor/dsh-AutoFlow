interface:
  display_name: "DSH 自定义插件发布"
  short_description: "发布 AFP 等独立插件的 GitHub 版本、校验值和更新元数据"
  default_prompt: "使用 $dsh-custom-plugin-release 核对目标插件版本与发布仓库，按已授权范围构建并发布 GitHub Release；确认公开状态、来源提交及资产齐备后结束，默认不下载回验、不创建隔离 profile 或演练更新。异常或明确要求时追加验证；保留用户改动，不覆盖已有版本。"
policy:
  allow_implicit_invocation: true
