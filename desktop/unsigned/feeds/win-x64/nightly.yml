releaseNotes: |-
  ## 新增功能

  - Visual Curator 可为新裁剪批次选择 Codex 生图账号，或已配置的 OpenAI API Key 及其可用模型；官方 Key 生成图按原生分辨率复审，不再超分。

  ## 问题修复

  - 修复视觉策展扩图后原图裁切边进入成品内部时彩妆物体仍留有平切的问题，并在接受成品前检查这些细节。

  ---

  ## New features

  - Visual Curator can select a Codex image account or a configured OpenAI API key and its available image model for each new crop batch; official-key images are reviewed at their native resolution without super-resolution.

  ## Bug fixes

  - Visual Curator completes cosmetic products where an old source crop becomes visible inside the new wallpaper, and checks those details before accepting the result.
