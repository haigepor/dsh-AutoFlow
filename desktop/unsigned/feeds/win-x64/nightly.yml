releaseNotes: |-
  ## 体验优化

  - 优化插件详情页更新区域：压缩脚本授权提示，突出重试操作，分开呈现检查记录与技术日志。
  - 视觉策展的设置页签、表单和底部操作区与图库共用左侧对齐线，宽窗口下继续保留适合阅读的表单宽度。

  ## 问题修复

  - 修复桌面端新增 ChatGPT 账号未自动打开登录页的问题；登录成功后自动刷新账号，并关闭本次持有的授权弹窗。

  ---

  ## Improvements

  - Plugin update details show compact script permission notices, clear retry actions and separate check history and technical logs.
  - Visual Curator aligns its settings tabs, forms and footer with the gallery's left edge while retaining readable form widths in large windows.

  ## Bug fixes

  - Adding a ChatGPT account opens the login page automatically when Desktop blocks a blank popup; completed logins refresh accounts and release their owned popup.
