releaseNotes: |-
  ## 新增功能

  - 启用“变更请求与工作树”后，对话输入框下方支持查看 Git 改动、提交所选文件、推送和切换本地分支，并可调用会话当前模型生成可编辑的提交信息。

  ## 问题修复

  - 修复调整代码字号后，会话工具卡片中的多行命令行距未同步变化的问题。

  ---

  ## New features

  - With Change requests & worktrees enabled, the conversation composer offers Git changes, selected-file commits, pushes and local branch switching, with editable commit messages generated by the session’s selected model.

  ## Bug fixes

  - Wrapped commands in conversation tool cards keep their line spacing when the code font size changes.
