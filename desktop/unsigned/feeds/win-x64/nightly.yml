  items:
    - id: visual-curator-complete-canvas-recovery
      category: fixes
      text:
        en: Fix pasted wallpaper panels and repeated generation during review recovery; saved tasks retain their policy until explicit current-policy review, with originals, versions and generation receipts preserved.
        zh-CN: 修复壁纸回贴重叠及复审恢复时重复生成的问题；历史任务继续使用冻结策略，显式采用当前规则才升级，原图、版本和生图回执均保留。
    - id: visual-curator-practical-subject-review
      category: improvements
      text:
        en: Visual Curator keeps every visible car part inside the safe area, applies stricter placement to other co-primary subjects and protects critical details while allowing natural background variation.
        zh-CN: 视觉策展确保汽车所有可见部分完整位于安全区，其他共同主角采用更严格的位置要求，保护关键细节并允许自然背景变化。
    - id: visual-curator-storage-directory
      category: features
      text:
        en: Visual Curator can move image storage to a selected directory while keeping existing tasks and image history accessible.
        zh-CN: 视觉策展可将图片存储迁移到所选目录，迁移后仍可访问现有任务与图片历史。
    - id: visual-curator-large-source-reference
      category: fixes
      text:
        en: High-resolution originals already accepted for import can prepare wallpaper references without another upload-limit rejection or reduced source quality.
        zh-CN: 修复已正常导入的高分辨率原图在准备壁纸参考图时再次因上传限额被拒绝的问题，保留原图质量。
releaseNotes: |-
  ## 新增功能

  - 视觉策展可将图片存储迁移到所选目录，迁移后仍可访问现有任务与图片历史。

  ## 体验优化

  - 视觉策展确保汽车所有可见部分完整位于安全区，其他共同主角采用更严格的位置要求，保护关键细节并允许自然背景变化。

  ## 问题修复

  - 修复壁纸回贴重叠及复审恢复时重复生成的问题；历史任务继续使用冻结策略，显式采用当前规则才升级，原图、版本和生图回执均保留。
  - 修复已正常导入的高分辨率原图在准备壁纸参考图时再次因上传限额被拒绝的问题，保留原图质量。

  ---

  ## New features

  - Visual Curator can move image storage to a selected directory while keeping existing tasks and image history accessible.

  ## Improvements

  - Visual Curator keeps every visible car part inside the safe area, applies stricter placement to other co-primary subjects and protects critical details while allowing natural background variation.

  ## Bug fixes

  - Fix pasted wallpaper panels and repeated generation during review recovery; saved tasks retain their policy until explicit current-policy review, with originals, versions and generation receipts preserved.
  - High-resolution originals already accepted for import can prepare wallpaper references without another upload-limit rejection or reduced source quality.
