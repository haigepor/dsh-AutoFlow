dshReleaseNotes:
  schemaVersion: 1
  version: 0.2.2-rc.1.20261115.3
  items:
    - id: visual-curator-image-options-loading
      category: improvements
      text:
        en: Image import settings preload the selected provider and reuse its catalog when reopened. Codex account selection reads local metadata without waiting for quota checks or unrelated API catalogs.
        zh-CN: 图片导入提前加载当前生图来源，重复打开复用目录；Codex 账号选择读取本地信息，无需等待配额查询或未选中 API 来源的目录。
    - id: visual-curator-import-table-progress
      category: fixes
      text:
        en: Original import confirmation closes on submission and stays closed after a failure. Batch table rows show progress, errors and retry actions while retaining the selected originals and request identity.
        zh-CN: 原图导入提交后立即关闭确认弹窗，失败时不再自动重开；导入进度、错误和重试直接显示在批次表格，保留所选原图和请求记录。
    - id: visual-curator-server-batch-upload
      category: fixes
      text:
        en: Server images complete only when the latest approved output is confirmed received. Incomplete images can be selected again with history retained, and approved results upload together after their batch finishes.
        zh-CN: 服务器图片仅在最新成品合格且确认上传后标记完成；其余图片支持重新选择并保留历史，批次处理结束后合并上传合格成品。
    - id: visual-curator-unified-import-confirmation
      category: fixes
      text:
        en: Local, gallery and server originals share one import confirmation for batch name, image account and model. The selected route is retained when an interrupted import resumes.
        zh-CN: 本地、收藏夹和服务器原图统一确认批次名称、生图账号与模型；中断后继续导入时保留所选生图设置。
releaseNotes: |-
  ## 体验优化

  - 图片导入提前加载当前生图来源，重复打开复用目录；Codex 账号选择读取本地信息，无需等待配额查询或未选中 API 来源的目录。

  ## 问题修复

  - 原图导入提交后立即关闭确认弹窗，失败时不再自动重开；导入进度、错误和重试直接显示在批次表格，保留所选原图和请求记录。
  - 服务器图片仅在最新成品合格且确认上传后标记完成；其余图片支持重新选择并保留历史，批次处理结束后合并上传合格成品。
  - 本地、收藏夹和服务器原图统一确认批次名称、生图账号与模型；中断后继续导入时保留所选生图设置。

  ---

  ## Improvements

  - Image import settings preload the selected provider and reuse its catalog when reopened. Codex account selection reads local metadata without waiting for quota checks or unrelated API catalogs.

  ## Bug fixes

  - Original import confirmation closes on submission and stays closed after a failure. Batch table rows show progress, errors and retry actions while retaining the selected originals and request identity.
  - Server images complete only when the latest approved output is confirmed received. Incomplete images can be selected again with history retained, and approved results upload together after their batch finishes.
  - Local, gallery and server originals share one import confirmation for batch name, image account and model. The selected route is retained when an interrupted import resumes.
