releaseNotes: |-
  ## 问题修复

  - 视觉策展分别显示暂停状态和远端生图回执。重试标明目标版本，同图复审保留在复审节点，旧规划可从原图复核接着处理。

  ---

  ## Bug fixes

  - Visual Curator shows pause status and remote image receipts separately. Retries name their target version, same-image reviews stay in the review step, and older planning holds can resume from original-image inspection.
