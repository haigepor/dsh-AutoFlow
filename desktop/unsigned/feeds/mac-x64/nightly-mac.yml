releaseNotes: |-
  ## 新增功能

  - 支持在设置中切换桌面正式版与开发版更新渠道，保留断点续传和安装前确认。
  - 视觉策展支持查看图片存储占用、调高存储上限，并在确认后清理未引用文件，保留已保存图片和任务历史；直接导入会记住生图来源与模型选择。

  ## 体验优化

  - 显示正文、代码和终端的默认字号，已保存的文字过大时可分别恢复默认。

  ## 问题修复

  - 下载文件校验期间，仍可点击更新状态重新打开进度窗口。

  ## 其他变更

  - 集成官方 dsh-v0.2.2-rc.3 的功能与修复，保留 AutoFlow 界面样式和自定义插件。

  ---

  ## New features

  - Switch between stable and development Desktop updates in Settings while retaining resumable downloads and installation confirmation.
  - Visual Curator shows image storage usage, increases the storage allowance and cleans unreferenced files after confirmation while protecting saved images and task history. Direct import remembers image provider and model selections.

  ## Improvements

  - Show the default text, code and terminal sizes and restore each independently when saved text appears too large.

  ## Bug fixes

  - Click the update status to reopen progress while downloaded files are being verified.

  ## Other changes

  - Integrate the official dsh-v0.2.2-rc.3 features and fixes while retaining AutoFlow's interface and custom plugins.
