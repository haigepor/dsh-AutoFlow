releaseNotes: |-
  ## 新增功能

  - 集成 DSH 0.2.2-rc.1，接入宿主级计划任务管理、模型请求兼容性修复及可选的变更请求与工作树工具。

  ## 体验优化

  - 改善窄屏导航和触屏菜单，接入统一右键菜单与文件操作，保留 AutoFlow 的主题及全窗口设置。
  - 插件更新安装完成后等待当前任务结束并自动重启生效；完成卡片显示等待和重启进度，功能标签及时反映真实运行状态。

  ## 问题修复

  - 修复智能体创建时切换预设的等待问题及标题输出重试分类；分享会话只显示已获准的管理操作，并补齐八种界面语言的本地设置文案。
  - 视觉策展随插件提供原生图片选择器和 Windows 对话框工作进程，修复旧桌面版加载失败的问题。

  ---

  ## New features

  - Integrate DSH 0.2.2-rc.1 with Host-wide scheduled-task management, model request compatibility fixes and optional change-request/worktree tools.

  ## Improvements

  - Improve narrow-screen navigation and touch menus, add shared context menus and file actions, and retain AutoFlow's theme and full-page settings.
  - Installed plugin updates apply automatically after current tasks finish. The completion card shows waiting and restart progress, while feature badges report their actual runtime state.

  ## Bug fixes

  - Fix preset selection during agent creation and title-output retries. Keep shared-session management menus within their granted access, and complete local settings copy for all eight interface languages.
  - Fix Visual Curator loading on older desktop builds by shipping its native image picker and Windows dialog worker with the plugin.
