releaseNotes: |-
  ## 新增功能

  - 已配置的 Codex 图片模型可通过原生模型接口供画布调用，分别保留生成原图和预览附件。
  - 风格提示词新增持久化节点画布，连接参考分析、双语提示词及生图分支，支持自动保存、历史和导入导出。

  ## 体验优化

  - 参考分析自动整理并保存数据集，统一正反例角色与规则统计，紧凑展示数据集版本历史。

  ## 其他变更

  - 随附视觉策展 0.2.13、Codex 订阅 0.2.3、风格提示词 0.2.0，保留已有 profile 数据和启用选择。

  ---

  ## New features

  - Configured Codex image models can generate original images and previews through the native model API for canvas workflows.
  - Style Prompt provides a persistent node canvas for reference analysis, bilingual prompts and image-generation branches, with autosave, history and import/export.

  ## Improvements

  - Reference analysis automatically organizes and saves datasets, with consistent positive/negative roles, rule statistics and compact version history.

  ## Other changes

  - Includes Visual Curator 0.2.13, Codex Subscription 0.2.3 and Style Prompt 0.2.0 while preserving saved profile data and activation choices.
